<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title"><title id="title">Suppliers: illustrative work example</title><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="640" height="300" rx="0" fill="#f2efe7"/><text x="35" y="48" fill="#102d2b" font-size="29" font-weight="600" >On the same terms.</text><text x="602" y="46" fill="#56766a" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1.7">QUOTE REVIEW</text><path d="M35 67L605 67" fill="none" stroke="#102d2b" stroke-width="2" /><text x="42" y="100" fill="#56766a" font-size="11" font-weight="700" letter-spacing="1.3">COMPARE</text><text x="290" y="100" fill="#102d2b" font-size="20" font-weight="600" >Offer A</text><text x="467" y="100" fill="#102d2b" font-size="20" font-weight="600" >Offer B</text><path d="M35 154L604 154" fill="none" stroke="#bdd0c4" stroke-width="1" /><text x="43" y="139" fill="#56766a" font-size="17" font-weight="400" >Delivery</text><text x="290" y="139" fill="#102d2b" font-size="19" font-weight="400" >Included</text><text x="469" y="139" fill="#16877f" font-size="19" font-weight="400" >Confirm</text><path d="M35 199L604 199" fill="none" stroke="#bdd0c4" stroke-width="1" /><text x="43" y="184" fill="#56766a" font-size="17" font-weight="400" >Support</text><text x="290" y="184" fill="#102d2b" font-size="19" font-weight="400" >12 months</text><text x="469" y="184" fill="#102d2b" font-size="19" font-weight="400" >12 months</text><path d="M35 244L604 244" fill="none" stroke="#bdd0c4" stroke-width="1" /><text x="43" y="229" fill="#56766a" font-size="17" font-weight="400" >Lead time</text><text x="290" y="229" fill="#102d2b" font-size="19" font-weight="400" >3 weeks</text><text x="469" y="229" fill="#102d2b" font-size="19" font-weight="400" >4 weeks</text><rect x="455" y="113" width="132" height="36" rx="0" fill="none" stroke="#16877f"/><text x="43" y="271" fill="#56766a" font-size="13" font-weight="400" >Inclusions, gaps and source quotes in one view.</text><text x="610" y="283" fill="#56766a" font-size="10" font-weight="400" text-anchor="end" letter-spacing="1.3">ILLUSTRATIVE EXAMPLE</text></g></svg>