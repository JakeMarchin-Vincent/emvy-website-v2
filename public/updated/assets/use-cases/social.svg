<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">An audience question becomes a social content outline</title>
<desc id="desc">An oversized audience question leads to a three-part carousel outline headed Start here. Illustrative example.</desc>
<rect width="640" height="300" fill="#c8d7c5"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#102d2b">
<text x="28" y="33" font-size="12" letter-spacing="1.5">LISTEN FIRST</text>
<text x="28" y="83" font-size="31" font-weight="700">“What should</text>
<text x="28" y="122" font-size="31" font-weight="700">I know</text>
<text x="28" y="161" font-size="31" font-weight="700">before</text>
<text x="28" y="200" font-size="31" font-weight="700">I start?”</text>
<path d="M29 226h137" stroke="#16877f" stroke-width="2"/>
<text x="28" y="253" font-size="16">An audience question</text>
<path d="M261 144h33m-9-9 9 9-9 9" fill="none" stroke="#102d2b" stroke-width="2"/>
<rect x="322" y="38" width="289" height="200" fill="#16877f"/>
<rect x="313" y="47" width="289" height="200" fill="#6de2d5"/>
<rect x="304" y="56" width="289" height="200" fill="#f2efe7"/>
<path d="M296 68v-20h20M581 48h20v20M296 244v20h20M581 264h20v-20" fill="none" stroke="#102d2b" stroke-width="1"/>
<text x="325" y="82" font-size="11" letter-spacing="1.4">CAROUSEL / CONTENT OUTLINE</text>
<text x="325" y="123" font-size="32" font-weight="700">Start here.</text>
<path d="M325 140h247" stroke="#16877f"/>
<g font-size="17"><text x="325" y="170" fill="#16877f">01</text><text x="361" y="170">What to expect</text>
<text x="325" y="202" fill="#16877f">02</text><text x="361" y="202">What to bring</text>
<text x="325" y="234" fill="#16877f">03</text><text x="361" y="234">Your first small step</text></g>
<text x="611" y="285" text-anchor="end" font-size="10" letter-spacing="1">ILLUSTRATIVE EXAMPLE</text>
</g>
</svg>