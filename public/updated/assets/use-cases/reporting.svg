<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">A monthly spend worksheet with a useful variance annotation</title>
<desc id="desc">Sample budget and actual spending figures show travel A$60 over its A$320 plan. The annotation calls for reviewing the receipts.</desc>
<rect width="640" height="300" fill="#102d2b"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#102d2b">
<rect x="24" y="23" width="436" height="250" fill="#f2efe7"/>
<text x="43" y="60" font-size="26" font-weight="700">Monthly spend</text>
<text x="43" y="85" font-size="16" fill="#16877f">Sample figures / A$</text>
<path d="M43 100h396" stroke="#102d2b" stroke-width="1.5"/>
<g font-size="16"><text x="43" y="125">Category</text><text x="315" y="125" text-anchor="end">Budget</text><text x="435" y="125" text-anchor="end">Actual</text></g>
<rect x="35" y="165" width="413" height="35" fill="#6de2d5" fill-opacity="0.57"/>
<g font-size="18"><text x="43" y="154">Tools</text><text x="315" y="154" text-anchor="end">240</text><text x="435" y="154" text-anchor="end">220</text>
<text x="43" y="188">Travel</text><text x="315" y="188" text-anchor="end">320</text><text x="435" y="188" text-anchor="end" font-weight="700">380</text>
<text x="43" y="222">Training</text><text x="315" y="222" text-anchor="end">180</text><text x="435" y="222" text-anchor="end">180</text></g>
<path d="M43 232h396" stroke="#102d2b"/>
<g font-size="18" font-weight="700"><text x="43" y="257">Total</text><text x="315" y="257" text-anchor="end">740</text><text x="435" y="257" text-anchor="end">780</text></g>
<g fill="#f2efe7"><text x="485" y="43" font-size="11" letter-spacing="1">CHECK THE DETAIL</text>
<text x="485" y="87" font-size="32" font-weight="700" fill="#6de2d5">+$60</text>
<text x="485" y="116" font-size="22">Travel</text><text x="485" y="142" font-size="22">variance</text>
<text x="485" y="179" font-size="17">Above plan in</text><text x="485" y="202" font-size="17">this sample.</text>
<text x="485" y="242" font-size="16">Review receipts</text>
<path d="M485 251h125" stroke="#6de2d5"/>
<text x="610" y="289" text-anchor="end" font-size="10" letter-spacing="1">ILLUSTRATIVE EXAMPLE</text></g>
<path d="M449 182h23v-66h7" fill="none" stroke="#6de2d5" stroke-width="1.5"/>
</g>
</svg>