<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">A briefing separates source changes from interpretation</title>
<desc id="desc">Two source clippings compare a sample lead time changing from ten days to seven, alongside separate fact and interpretation notes. Illustrative example.</desc>
<rect width="640" height="300" fill="#102d2b"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#102d2b">
<text x="27" y="51" font-size="30" font-weight="700" fill="#f2efe7">What changed?</text>
<text x="611" y="46" text-anchor="end" font-size="12" letter-spacing="1.3" fill="#6de2d5">SAMPLE BRIEF / 04</text>
<path d="M27 66h585" stroke="#6de2d5" stroke-width="1"/>
<rect x="27" y="84" width="363" height="176" fill="#f2efe7"/>
<path d="M208 101v115" stroke="#c8d7c5"/>
<g font-size="11" letter-spacing="1"><text x="44" y="111">SOURCE / PREVIOUS</text><text x="226" y="111">SOURCE / UPDATED</text></g>
<g font-size="17" fill="#16877f"><text x="44" y="148">Lead time</text><text x="226" y="148">Lead time</text></g>
<path d="M226 180h115" stroke="#6de2d5" stroke-width="25"/>
<text x="44" y="191" font-size="32" font-weight="700">10 days</text>
<text x="226" y="191" font-size="32" font-weight="700">7 days</text>
<path d="M44 211h328" stroke="#c8d7c5"/>
<text x="44" y="240" font-size="16">Same product. Revised lead time.</text>
<g fill="#f2efe7"><text x="420" y="101" font-size="12" letter-spacing="1.5" fill="#6de2d5">FACT</text>
<text x="420" y="130" font-size="19">The source lists</text><text x="420" y="155" font-size="19">7 days, down from 10.</text>
<path d="M420 173h192" stroke="#16877f"/>
<text x="420" y="199" font-size="12" letter-spacing="1.1" fill="#6de2d5">INTERPRETATION</text>
<text x="420" y="227" font-size="17">Worth checking before</text><text x="420" y="250" font-size="17">making a plan.</text>
<text x="611" y="286" text-anchor="end" font-size="10" letter-spacing="1">ILLUSTRATIVE EXAMPLE</text></g>
</g>
</svg>