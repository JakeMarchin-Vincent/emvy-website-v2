<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">A project milestone map makes a missing dependency visible</title>
<desc id="desc">A sample launch plan runs from brief to build, review and launch, with final copy highlighted as the input needed before review. Illustrative example.</desc>
<rect width="640" height="300" fill="#f2efe7"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#102d2b">
<text x="28" y="45" font-size="30" font-weight="700">One missing input.</text>
<text x="28" y="74" font-size="16" fill="#16877f">Sample launch plan</text>
<rect x="331" y="80" width="148" height="43" fill="#6de2d5"/>
<text x="405" y="107" font-size="18" text-anchor="middle" font-weight="700">Final copy</text>
<text x="493" y="106" font-size="16" fill="#16877f">Input needed</text>
<path d="M405 123v27m-5-6 5 6 5-6" fill="none" stroke="#16877f" stroke-width="1.5"/>
<path d="M68 168h168" stroke="#102d2b" stroke-width="2"/>
<path d="M250 168h140" stroke="#16877f" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M420 168h150" stroke="#c8d7c5" stroke-width="2"/>
<circle cx="68" cy="168" r="16" fill="#102d2b"/>
<circle cx="236" cy="168" r="16" fill="#6de2d5" stroke="#102d2b" stroke-width="1.5"/>
<circle cx="405" cy="168" r="16" fill="#f2efe7" stroke="#16877f" stroke-width="2"/>
<circle cx="570" cy="168" r="16" fill="#f2efe7" stroke="#c8d7c5" stroke-width="2"/>
<g font-size="15" text-anchor="middle"><text x="68" y="174" fill="#f2efe7">1</text><text x="236" y="174">2</text><text x="405" y="174">3</text><text x="570" y="174" fill="#16877f">4</text></g>
<g font-size="21" font-weight="700" text-anchor="middle"><text x="68" y="213">Brief</text><text x="236" y="213">Build</text><text x="405" y="213">Review</text><text x="570" y="213">Launch</text></g>
<g font-size="16" fill="#16877f" text-anchor="middle"><text x="68" y="238">Agreed</text><text x="236" y="238">In progress</text><text x="405" y="238">Waiting for copy</text><text x="570" y="238">Queued</text></g>
<path d="M28 265h584" stroke="#c8d7c5"/>
<text x="611" y="286" text-anchor="end" font-size="10" letter-spacing="1">ILLUSTRATIVE EXAMPLE</text>
</g>
</svg>